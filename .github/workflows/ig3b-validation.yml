name: IG-3B Multicard Validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm ci

      - name: Validate Interpretation Graph
        run: |
          python3 tools/interpretation-graph/validate_interpretation_graph.py
          python3 tools/interpretation-graph/validate_multicard_graph.py

      - name: Run offline evaluators
        run: |
          python3 tools/interpretation-graph/evaluate_tower_offline.py
          python3 tools/interpretation-graph/evaluate_prompt_composer.py
          python3 tools/interpretation-graph/evaluate_multicard_offline.py

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
