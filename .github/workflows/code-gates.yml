name: Code Gates — Insight Engine

# Runs the real engineering gates (lint, typecheck, test, build) on every PR
# into the integration branch. This is the check the protected `main` ruleset
# will require once the default-branch migration runs (see
# docs/DEFAULT_BRANCH_MIGRATION_PROPOSAL.md). Additive to validation-gates.yml
# (docs-only). Targets `main` for when it exists, plus the current active line.
on:
  pull_request:
    branches:
      - main
      - feat/insight-engine-milestone-3
      - 'claude/**'
  push:
    branches:
      - main
  workflow_dispatch:

# H1: least privilege. This workflow only reads the checkout and reports a
# check - it never writes to the repo, so the default (broader) token scope
# was unnecessary standing authority on every PR run.
permissions:
  contents: read

jobs:
  code-gates:
    name: lint / typecheck / test / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Asset gate (report-only for now — pilot art pending)
        run: npm run assets:validate
