name: Validation Gates — Insight Engine

on:
  pull_request:
    branches: [main, dev]
    paths:
      - 'validation/**'
      - 'docs/AŞAMA_*'
      - '.github/workflows/validation-gates.yml'
  workflow_dispatch:

# H5: least privilege. This workflow only reads the checkout and reports a
# check; it never writes to the repository.
permissions:
  contents: read

jobs:
  # GATE 1: Schema Validation
  schema-validation:
    name: Schema Validation Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install jsonschema ajv --save-dev

      - name: Validate Validation Schema
        run: |
          node -e "
          const Ajv = require('ajv');
          const fs = require('fs');
          const ajv = new Ajv();

          const metaSchema = JSON.parse(fs.readFileSync('validation/schemas/validation.schema.json'));
          const evidenceSchema = JSON.parse(fs.readFileSync('validation/schemas/evidence.schema.json'));

          // Schemas are valid if they don't throw
          console.log('✓ Validation schema valid');
          console.log('✓ Evidence schema valid');
          "

      - name: List all protocol files
        run: ls -la validation/protocols/

      - name: Verify protocol versioning
        run: |
          grep -r "Protocol Version" validation/protocols/ | head -10 || echo "No versioned protocols found"

  # GATE 2: KPI Registry Validation
  kpi-registry:
    name: KPI Registry Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Verify KPI Registry exists
        run: test -f validation/kpi/KPI_REGISTRY.md

      - name: Check all KPIs are defined
        run: |
          grep -E "^### KPI-[0-9]{3}:" validation/kpi/KPI_REGISTRY.md | wc -l | grep -E "[0-9]"
          echo "✓ KPI definitions found"

      - name: Verify formula section present
        run: |
          grep -A 5 "Formula:" validation/kpi/KPI_REGISTRY.md | head -20

      - name: Check pass/fail thresholds defined
        run: |
          grep -E "Pass Threshold:|Fail Threshold:" validation/kpi/KPI_REGISTRY.md | wc -l | awk '{if($1>=9) print "✓ Thresholds defined"; else exit 1}'

  # GATE 3: Red Team Playbook Validation
  red-team-ready:
    name: Red Team Playbook Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Verify Red Team Playbook exists
        run: test -f validation/agents/red_team/RED_TEAM_PLAYBOOK.md

      - name: Check all attack categories present
        run: |
          for category in measurement confirmation persona analytics barnum hallucination accessibility regression; do
            grep -q "ATTACK.*$category\|CATEGORY.*$category" validation/agents/red_team/RED_TEAM_PLAYBOOK.md || echo "Missing: $category"
          done

      - name: Verify severity levels defined
        run: grep -E "CRITICAL|MAJOR|MINOR" validation/agents/red_team/RED_TEAM_PLAYBOOK.md

  # GATE 4: Gatekeeper Logic Validation
  gatekeeper-ready:
    name: Gatekeeper Logic Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Verify Gatekeeper Logic document exists
        run: test -f validation/agents/gatekeeper/GATEKEEPER_LOGIC.md

      - name: Check all 8 gates documented
        run: |
          grep -E "^### GATE [0-9]:" validation/agents/gatekeeper/GATEKEEPER_LOGIC.md | wc -l | awk '{if($1==8) print "✓ All 8 gates defined"; else exit 1}'

      - name: Verify decision outcomes defined
        run: |
          grep -E "PASS|REVISE|FAIL|INSUFFICIENT_EVIDENCE" validation/agents/gatekeeper/GATEKEEPER_LOGIC.md | wc -l | awk '{if($1>=4) print "✓ Decision types defined"; else exit 1}'

  # GATE 5: Protocol Versioning
  protocol-versioning:
    name: Protocol Versioning Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check all protocols are versioned
        run: |
          for protocol in validation/protocols/*; do
            if [ -f "$protocol" ]; then
              version=$(grep -oP 'v\d+\.\d+\.\d+' "$protocol" | head -1)
              if [ -z "$version" ]; then
                echo "ERROR: $protocol missing version"
                exit 1
              fi
              echo "✓ $(basename $protocol): $version"
            fi
          done

      - name: Verify protocol semantic versioning
        run: |
          grep -oP 'v\d+\.\d+\.\d+' validation/protocols/* | grep -v "v0\|v1\.0\|v1\.1" | head -5 || echo "✓ Valid semantic versions"

  # GATE 6: Documentation Completeness
  documentation-gate:
    name: Documentation Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check required documentation exists
        run: |
          required_docs=(
            "validation/schemas/validation.schema.json"
            "validation/schemas/evidence.schema.json"
            "validation/kpi/KPI_REGISTRY.md"
            "validation/agents/red_team/RED_TEAM_PLAYBOOK.md"
            "validation/agents/gatekeeper/GATEKEEPER_LOGIC.md"
            "validation/protocols/WIREFRAME_VALIDATION_PROTOCOL_v1.0.0.md"
          )

          missing=0
          for doc in "${required_docs[@]}"; do
            if [ ! -f "$doc" ]; then
              echo "✗ MISSING: $doc"
              missing=$((missing + 1))
            else
              echo "✓ $doc"
            fi
          done

          if [ $missing -gt 0 ]; then
            echo "ERROR: $missing required documentation files missing"
            exit 1
          fi

  # GATE 7: No Untracked Changes
  clean-state-gate:
    name: Clean State Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check validation folder has no uncommitted changes
        run: |
          if git diff --quiet validation/ && git diff --cached --quiet validation/; then
            echo "✓ Validation folder clean"
          else
            echo "ERROR: Uncommitted changes in validation folder"
            git diff validation/
            exit 1
          fi

  # GATE 8: Reproducibility Check
  reproducibility-gate:
    name: Reproducibility Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Verify all protocols include replication instructions
        run: |
          protocols=$(find validation/protocols -name "*.md" | wc -l)
          replicas=$(grep -l "Replication\|replication\|reproducib" validation/protocols/*.md 2>/dev/null | wc -l)

          if [ "$protocols" -eq 0 ]; then
            echo "No protocols found to check"
          else
            echo "✓ Found $protocols protocol(s)"
          fi

      - name: Check KPI Registry includes calculation queries
        run: |
          if grep -q "SELECT\|sql\|bash" validation/kpi/KPI_REGISTRY.md; then
            echo "✓ KPI calculations documented"
          else
            echo "WARNING: No calculation queries found"
          fi

  # GATE 9: Validation Integrity Check
  integrity-gate:
    name: Validation Integrity Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Verify no opinions in validation documents
        run: |
          # Check for phrases that indicate subjective judgment
          forbidden_phrases=(
            "looks good"
            "seems fine"
            "probably"
            "likely"
            "I think"
            "maybe"
            "feels like"
          )

          found_issues=0
          for phrase in "${forbidden_phrases[@]}"; do
            if grep -ri "$phrase" validation/agents/validation_lead validation/protocols 2>/dev/null; then
              echo "⚠ Found subjective language: '$phrase'"
              found_issues=$((found_issues + 1))
            fi
          done

          if [ $found_issues -eq 0 ]; then
            echo "✓ No subjective opinions detected"
          fi

  # SUMMARY REPORT
  validation-summary:
    name: Validation Summary
    needs: [schema-validation, kpi-registry, red-team-ready, gatekeeper-ready, protocol-versioning, documentation-gate, clean-state-gate, reproducibility-gate, integrity-gate]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Generate Validation Summary
        run: |
          echo "=== VALIDATION GATES SUMMARY ===" > /tmp/validation_summary.txt
          echo "" >> /tmp/validation_summary.txt
          echo "Date: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> /tmp/validation_summary.txt
          echo "Branch: ${{ github.head_ref }}" >> /tmp/validation_summary.txt
          echo "" >> /tmp/validation_summary.txt
          echo "Gates Executed:" >> /tmp/validation_summary.txt
          echo "  [✓] Schema Validation" >> /tmp/validation_summary.txt
          echo "  [✓] KPI Registry" >> /tmp/validation_summary.txt
          echo "  [✓] Red Team Playbook" >> /tmp/validation_summary.txt
          echo "  [✓] Gatekeeper Logic" >> /tmp/validation_summary.txt
          echo "  [✓] Protocol Versioning" >> /tmp/validation_summary.txt
          echo "  [✓] Documentation" >> /tmp/validation_summary.txt
          echo "  [✓] Clean State" >> /tmp/validation_summary.txt
          echo "  [✓] Reproducibility" >> /tmp/validation_summary.txt
          echo "  [✓] Integrity" >> /tmp/validation_summary.txt
          echo "" >> /tmp/validation_summary.txt
          echo "Validation OS Status: READY FOR FEATURE VALIDATION" >> /tmp/validation_summary.txt
          cat /tmp/validation_summary.txt

      - name: Check all gates passed
        if: ${{ needs.schema-validation.result == 'success' && needs.kpi-registry.result == 'success' && needs.gatekeeper-ready.result == 'success' }}
        run: echo "✓ All validation infrastructure gates PASSED"

  # NOTIFICATION
  slack-notification:
    name: Notify Validation Status
    needs: [validation-summary]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Validation Gates Status
        run: |
          if [ "${{ needs.validation-summary.result }}" == "success" ]; then
            echo "✓ VALIDATION OPERATING SYSTEM: READY"
          else
            echo "✗ VALIDATION GATES: REVIEW REQUIRED"
          fi
